# meson: static AArch64 Linux programs with musl through zig (build.sh
# substitutes @TOOLS@)
[binaries]
c = '@TOOLS@/zig-cc'
cpp = '@TOOLS@/zig-c++'
ar = '@TOOLS@/zig-ar'
ranlib = '@TOOLS@/zig-ranlib'
strip = 'llvm-strip'
pkg-config = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'cortex-a53'
endian = 'little'
