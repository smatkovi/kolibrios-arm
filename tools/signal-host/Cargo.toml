# signal-host: the Signal backend of KolibriOS's messenger
# (docs/messengers.md), presage on libsignal in one static AArch64 Linux
# program for the kernel's Linux personality. Built by build.sh.
[package]
name = "signal-host"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
# presage of 2026-10-27 ("feat(manager): sync groups from the storage
# service"); it pins libsignal-service-rs 72a09876 and that libsignal v0.99.0
presage = { git = "https://github.com/whisperfish/presage", rev = "aeaedf99babebae2dbc6b86bca797807d4cd9fda" }
# without SQLCipher (its default): plain SQLite, compiled in
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "aeaedf99babebae2dbc6b86bca797807d4cd9fda", default-features = false }
libsqlite3-sys = { version = "0.36.0", features = ["bundled"] }
futures = "0.3"
serde_json = "1.0"
tokio = { version = "1.48", default-features = false, features = ["rt", "macros", "io-std", "io-util", "sync", "time"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

# as presage's workspace has it (a dependency's [patch] does not reach here)
[patch.crates-io]
libsqlite3-sys = { git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }

[profile.release]
opt-level = 3
debug = false
strip = true
codegen-units = 16
